name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Syntax check
        run: bash -n sogno

      - name: Shellcheck
        if: matrix.os == 'ubuntu-latest'
        run: shellcheck -S warning sogno test/*.sh

      # bash, not sh: the tests source sogno, whose arrays dash cannot parse.
      - name: Test helpers
        run: bash test/check-helpers.sh

      - name: Test dream orchestrator
        run: bash test/check-dream.sh
